$kind: http-request
url: "{{baseUrl}}/api/calls"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: text
  content: |-
    {
      "appointmentId": "{{appointmentId}}",
      "callType": "VOICE"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.success && jsonData.data && jsonData.data.callSession) {
          pm.collectionVariables.set('callSessionId', jsonData.data.callSession.id);
          console.log('Saved Call Session ID:', jsonData.data.callSession.id);
      }
    language: text/javascript
order: 1000
